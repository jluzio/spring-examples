plugins {
  id 'org.springframework.boot' version '4.0.2'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.jetbrains.kotlin.jvm' version '2.4.0'
  id 'org.jetbrains.kotlin.plugin.spring' version '2.4.0'
  id 'gg.jte.gradle' version '3.2.4'
}

group = 'com.example.spring'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  def kotlinxHtmlVersion = "0.12.0"
  def jteVersion = "3.2.4"

  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-mustache'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-jackson2'
  implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
  implementation 'org.jetbrains.kotlin:kotlin-reflect'
  implementation 'io.github.wimdeblauwe:htmx-spring-boot:5.1.0'
  implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
  implementation 'org.webjars:webjars-locator-lite'
  implementation 'org.webjars:bootstrap:5.3.8'
  implementation 'org.webjars.npm:htmx.org:2.0.10'
  implementation 'org.webjars.npm:hyperscript.org:0.9.91'
  implementation 'org.webjars.npm:mustache:4.2.0'
  implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:4.0.1'
  implementation 'com.j2html:j2html:1.6.0'
  implementation "org.jetbrains.kotlinx:kotlinx-html:$kotlinxHtmlVersion"
  // include for JVM target
  implementation "org.jetbrains.kotlinx:kotlinx-html-jvm:$kotlinxHtmlVersion"
  // include for JS target
  //	implementation "org.jetbrains.kotlinx:kotlinx-html-js:$kotlinxHtmlVersion"
  implementation "gg.jte:jte:$jteVersion"
  implementation "gg.jte:jte-spring-boot-starter-4:$jteVersion"
  implementation "gg.jte:jte-kotlin:$jteVersion"
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-mustache-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
}

kotlin {
  compilerOptions {
    freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
  }
}

jte {
  generate()
  binaryStaticContent = true
}

tasks.named('test') {
  useJUnitPlatform()
}
